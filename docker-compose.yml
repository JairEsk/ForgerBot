version: '3.8'

services:
  forgerbot:
    build: .
    container_name: forgerbot
    restart: unless-stopped
    environment:
      # El token se inyectará desde las variables de entorno de Dokploy
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      # Redirigimos la base de datos a la carpeta del volumen persistente
      - DATABASE_PATH=/data/data.db
    volumes:
      # Montamos un volumen nombrado en la ruta /data del contenedor
      - forgerbot_data:/data

volumes:
  forgerbot_data:
