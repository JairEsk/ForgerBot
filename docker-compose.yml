version: '3.8'

services:
  forgerbot:
    build: .
    container_name: forgerbot
    restart: unless-stopped
    environment:
      # Token injected from Dokploy environment variables
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      # Redirect database to persistent volume path
      - DATABASE_PATH=/data/data.db
    volumes:
      # Mount a named volume at /data inside the container
      - forgerbot_data:/data

volumes:
  forgerbot_data:
